<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti 💛</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, #050b14, #0f1c2e, #1a2f4c);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .welcome-card h1 {
            font-family: 'Dancing Script', cursive;
            color: #ffeb3b;
            font-size: 2.8rem;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(255, 235, 59, 0.3);
        }

        .welcome-card p {
            color: #e0e6ed;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .btn-abrir {
            background: linear-gradient(135deg, #ffd700, #ffb300);
            color: #1a1a1a;
            border: none;
            padding: 14px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-abrir:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
            background: linear-gradient(135deg, #ffe55c, #ffc107);
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>Para Ti 💛</h1>
        <p>He preparado este pequeño detalle para que sepas que siempre pienso en ti. Toca el botón cuando estés lista.</p>
        
        <!-- Único botón que activa la música y abre MICHI.html -->
        <button class="btn-abrir" onclick="abrirSorpresa()">Abrir Sorpresa ✨</button>
    </div>

    <script>
        function abrirSorpresa() {
            localStorage.setItem('reproducirMusica', 'true');
            window.location.href = 'MICHI.html';
        }
    </script>

</body>
</html>
