<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Mi Amor - Flores Amarillas</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow-tulip: #ffda1a;
            --yellow-tulip-dark: #f0c300;
            --yellow-lily: #fff056;
            --yellow-lily-dark: #ffd700;
            --stem-green: #5c8a47;
            --leaf-green: #70a05a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(to bottom, #1a1a2e, #16213e, #0f3460, #e94560);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed; /* Evita el scroll y rebote elástico en móviles */
            width: 100%;
            height: 100%;
        }

        html {
            height: -webkit-fill-available;
            overflow: hidden;
        }

        .background-stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px rgba(255, 255, 255, 0.8); }
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 22px 18px;
            width: 88%;
            max-width: 360px;
            text-align: center;
            color: #fff;
            z-index: 10;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            animation: fadeIn 2s ease-out;
            margin-bottom: 70px;
        }

        .card h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.3rem;
            color: #ffd700;
            margin-bottom: 12px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .card p {
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 10px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }

        .card .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 1.6rem;
            margin-top: 15px;
            color: #ffda1a;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .garden {
            position: absolute;
            bottom: 0;
            width: 100%;
            left: 0;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            z-index: 5;
            pointer-events: none;
            overflow: hidden;
        }

        .flower-wrapper {
            position: relative;
            transform-origin: bottom center;
            animation: sway 4s ease-in-out infinite alternate;
            margin: 0 -18px;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3));
        }

        @keyframes sway {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        svg {
            width: 90px;
            height: auto;
            overflow: visible;
        }

        .lily-svg { width: 100px; }

        .petal {
            position: absolute;
            background-color: var(--yellow-tulip);
            border-radius: 150% 0 150% 0;
            opacity: 0.8;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            animation: fall linear infinite;
            z-index: 8;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% {
                transform: translateY(110vh) rotate(360deg) scale(0.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="background-stars" id="stars-container"></div>

    <div class="card">
        <h1>Para Ti, Mi Amor</h1>
        <p>Aunque los kilómetros nos separen hoy, mi corazón siempre florece al pensar en ti.</p>
        <p>Como no puedo dártelas en persona, te regalo este detalle, para iluminar tu día.</p>
        <p>Te extraño, y te quiero muchísimo.</p>
        <div class="signature">Siempre contigo ❤️</div>
    </div>

    <svg style="display: none;">
        <defs>
            <g id="tulip">
                <!-- Tallo -->
                <path d="M50 150 Q45 220 50 300" stroke="var(--stem-green)" stroke-width="6" fill="none"/>
                <!-- Hojas -->
                <path d="M50 250 Q20 220 30 180 Q40 220 50 250" fill="var(--leaf-green)"/>
                <path d="M50 220 Q80 190 70 140 Q60 190 50 220" fill="var(--leaf-green)"/>
                <!-- Cabeza -->
                <path d="M30 100 C 30 150 70 150 70 100 C 70 80 60 60 50 50 C 40 60 30 80 30 100 Z" fill="var(--yellow-tulip-dark)"/>
                <path d="M35 90 C 35 140 65 140 65 90 C 65 70 55 60 50 55 C 45 60 35 70 35 90 Z" fill="var(--yellow-tulip)"/>
                <path d="M42 85 C 42 120 58 120 58 85 C 58 75 53 68 50 65 C 47 68 42 75 42 85 Z" fill="#fff5b3"/>
            </g>
            <g id="lily">
                <!-- Tallo -->
                <path d="M75 140 Q80 220 75 300" stroke="var(--stem-green)" stroke-width="5" fill="none"/>
                <!-- Hojas -->
                <path d="M75 200 Q40 180 20 190 Q50 210 75 200" fill="var(--leaf-green)"/>
                <path d="M75 240 Q110 220 130 230 Q100 250 75 240" fill="var(--leaf-green)"/>
                <!-- Pétalos -->
                <g transform="translate(75,100)">
                    <path d="M0,0 Q-30,-20 0,-70 Q30,-20 0,0" fill="var(--yellow-lily-dark)"/>
                    <path d="M0,0 Q-50,-10 -60,20 Q-20,-10 0,0" fill="var(--yellow-lily)"/>
                    <path d="M0,0 Q50,-10 60,20 Q20,-10 0,0" fill="var(--yellow-lily)"/>
                    <path d="M0,0 Q-40,20 -30,60 Q-10,20 0,0" fill="var(--yellow-lily-dark)"/>
                    <path d="M0,0 Q40,20 30,60 Q10,20 0,0" fill="var(--yellow-lily-dark)"/>
                    <line x1="0" y1="0" x2="-15" y2="-40" stroke="#d97700" stroke-width="2"/>
                    <circle cx="-15" cy="-40" r="3" fill="#8c2e00"/>
                    <line x1="0" y1="0" x2="15" y2="-35" stroke="#d97700" stroke-width="2"/>
                    <circle cx="15" cy="-35" r="3" fill="#8c2e00"/>
                    <line x1="0" y1="0" x2="0" y2="-45" stroke="#8cb56a" stroke-width="3"/>
                </g>
            </g>
        </defs>
    </svg>

    <div class="garden" id="garden"></div>

    <script>
        // Función para crear estrellas en el fondo
        const starsContainer = document.getElementById('stars-container');
        const numStars = 35; 

        for (let i = 0; i < numStars; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = `${Math.random() * 3 + 1}px`;
            star.style.height = star.style.width;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animationDuration = `${Math.random() * 2 + 1}s`;
            star.style.animationDelay = `${Math.random() * 2}s`;
            starsContainer.appendChild(star);
        }

        // Función para crear pétalos cayendo
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 8 + 6; 
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            petal.style.animationDuration = `${Math.random() * 5 + 4}s`;
            
            document.body.appendChild(petal);
            
            setTimeout(() => {
                petal.remove();
            }, 9000);
        }

        setInterval(createPetal, 600);

        function generateGarden() {
            const garden = document.getElementById('garden');
            const screenWidth = window.innerWidth;
            const totalFlowers = Math.floor(screenWidth / 22); // Densidad optimizada para móviles

            for (let i = 0; i < totalFlowers; i++) {
                const wrapper = document.createElement('div');
                wrapper.classList.add('flower-wrapper');
                
                const isLily = Math.random() > 0.55; 
                const svgId = isLily ? 'lily' : 'tulip';
                const viewBox = isLily ? '0 0 150 300' : '0 0 100 300';
                
                const scale = 0.35 + Math.random() * 0.4; // Escala ligera y perfecta para celulares
                const delay = Math.random() * -5;
                const duration = 3 + Math.random() * 3;
                const zIndex = Math.floor(Math.random() * 20); 
                
                wrapper.style.transform = `scale(${scale})`;
                wrapper.style.animationDelay = `${delay}s`;
                wrapper.style.animationDuration = `${duration}s`;
                wrapper.style.zIndex = zIndex;
                
                if (zIndex < 10) {
                    wrapper.style.filter = 'brightness(0.7) drop-shadow(0 0 5px rgba(255, 215, 0, 0.1))';
                }
                
                wrapper.innerHTML = `
                    <svg viewBox="${viewBox}" class="${isLily ? 'lily-svg' : ''}">
                        <use href="#${svgId}" />
                    </svg>
                `;
                
                garden.appendChild(wrapper);
            }
        }

        generateGarden();

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                document.getElementById('garden').innerHTML = '';
                generateGarden();
            }, 250);
        });

        window.addEventListener('load', () => {
            if (localStorage.getItem('reproducirMusica') === 'true') {
                const audio = document.getElementById('cancion');
                audio.play().catch(error => {
                    console.log("Reproducción bloqueada:", error);
                });
                localStorage.removeItem('reproducirMusica');
            }
        });
    </script>

    <audio id="cancion" src="1.mp3" preload="auto"></audio>

</body>
</html>
